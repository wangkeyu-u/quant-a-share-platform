name: Temporal validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  temporal-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas scikit-learn joblib
      - run: python -m unittest discover -s tests -p test_temporal_validation.py -v

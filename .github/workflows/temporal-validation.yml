name: Offline regression validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas scikit-learn joblib
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
